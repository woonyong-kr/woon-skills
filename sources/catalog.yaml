version: 1
checked_at: 2026-08-09
policy:
  discovery_only: popularity is not a quality score
  vendor_copy: pin commit and preserve upstream license
  woon_derivation: rewrite narrowly, record sources, validate routing and behavior
repositories:
  - id: agent-skills-spec
    upstream: https://github.com/agentskills/agentskills
    checked_commit: 217be548739f21d6008915c29aefe320ea1a90af
    status: adopted-standard
    license: Apache-2.0-code-and-CC-BY-4.0-docs
    improves: [skills/skill-system/audit, skills/skill-system/budget, skills/skill-system/registry]
    decision: use the portable SKILL.md format and progressive disclosure while keeping stricter Woon metadata, profile and evidence gates
  - id: openai-plugins
    upstream: https://github.com/openai/plugins
    status: canonical-discovery
    license: per-plugin
    decision: inspect individual plugin skill and MCP boundaries before adoption
  - id: microsoft-playwright-cli
    upstream: https://github.com/microsoft/playwright-cli
    status: adopted-concepts
    license: Apache-2.0
    improves: [skills/web/e2e, skills/web/ui-test]
    decision: prefer focused CLI/browser workflows over an always-on browser MCP
  - id: addyosmani-agent-skills
    upstream: https://github.com/addyosmani/agent-skills
    checked_commit: 7676817c12a1317454ae3898a0c5c1eacf5dd3d5
    status: adopted-concepts
    license: MIT
    improves: [skills/common/review, skills/common/refactor, skills/common/verify, skills/skill-system/comply]
    decision: select small, actionable, verifiable workflow concepts instead of bulk install
  - id: microsoft-waza
    upstream: https://github.com/microsoft/waza
    checked_commit: 7c2e710290edc6e978e228f5949a2d1d3d26820c
    status: adopted-concepts
    license: MIT
    improves: [skills/skill-system/comply, skills/skill-system/budget]
    decision: adopt baseline, trials, deterministic graders, snapshots, adversarial cases and token comparison without locking Woon to the Copilot executor
  - id: microsoft-skills
    upstream: https://github.com/microsoft/skills
    checked_commit: 757d0aaa5d6cfc020ebf43b778095ba047eba0b6
    status: adopted-concepts
    license: per-skill
    improves: [skills/skill-system/comply]
    decision: adopt expected and forbidden outcomes plus iterative feedback while retaining Woon ownership and schema
  - id: kepano-obsidian-skills
    upstream: https://github.com/kepano/obsidian-skills
    status: evaluated
    license: MIT
    improves: [skills/docs/diagram, skills/knowledge/knowledge]
    decision: do not copy vault conventions that conflict with woon-knowledge canonical rules
  - id: hashicorp-agent-skills
    upstream: https://github.com/hashicorp/agent-skills
    status: candidate
    license: MPL-2.0
    decision: add a focused Terraform profile only when a Woon repository needs it
  - id: vercel-agent-skills
    upstream: https://github.com/vercel-labs/agent-skills
    status: adopted-concepts
    license: per-skill
    improves: [skills/web/react]
    decision: retain React performance guidance; deployment remains explicit
  - id: anthropic-skills
    upstream: https://github.com/anthropics/skills
    checked_commit: f17010c9bb483898c1d9c9f42dde2b3a98889434
    status: adopted-concepts
    license: per-skill
    improves: [skills/skill-system/comply]
    decision: adopt blind baseline comparison, held-out trigger evaluation and artifact evidence; use artifact format skills as installed fallback without copying them into Woon
  - id: cloudflare-security-audit
    upstream: https://github.com/cloudflare/security-audit-skill
    status: evaluated
    license: MIT
    improves: [skills/security/security]
    decision: keep Woon evidence and scope gates instead of importing parallel-agent workflow
  - id: aws-agent-toolkit
    upstream: https://github.com/aws/agent-toolkit-for-aws
    status: candidate
    license: Apache-2.0
    decision: prefer over awslabs/mcp only when AWS becomes an active repository requirement
  - id: obra-superpowers
    upstream: https://github.com/obra/superpowers
    checked_commit: 44c9b2d6e889982ac18c27d05a19fefe335194e1
    checked_version: 6.2.0
    status: adopted-selectively
    license: MIT
    improves: [skills/common/test, skills/skill-system/comply]
    decision: adopt test behavior and skill evaluation evidence; reject session hooks, mandatory approval gates and automatic subagent or worktree workflows that conflict with Woon autonomy, ownership and context budgets
  - id: affaan-ecc
    upstream: https://github.com/affaan-m/ECC
    checked_commit: 2d46e80e0925c7be0907f18c1812311ac212a6c5
    checked_version: 2.2.0
    status: adopted-selectively
    license: MIT
    improves: [skills/ai/agent-audit]
    decision: audit all 284 canonical skills, adopt only the measured agent-wrapper diagnostic gap, retain Woon owners for equivalent behavior and reject always-on hooks, self-modifying memory and orchestration controllers
  - id: ecc-legacy-vendor
    upstream: https://github.com/Jungle-12-303/skills.git
    status: vendor-locked
    license: per-skill
    decision: keep immutable for comparison; exclude all 183 skills from default profiles
