version: 1
standards:
  standards/obsidian-compatibility.md:
    adapted_from:
      - https://github.com/kepano/obsidian-skills/tree/a1dc48e68138490d522c04cbf5822214c6eb1202/skills/obsidian-markdown
      - https://github.com/kepano/obsidian-skills/tree/a1dc48e68138490d522c04cbf5822214c6eb1202/skills/json-canvas
      - https://github.com/kepano/obsidian-skills/tree/a1dc48e68138490d522c04cbf5822214c6eb1202/skills/obsidian-bases
    changed: separated MCP envelope from Markdown body, restricted links by verified canonical ID and visibility, kept Mermaid canonical, and demoted Canvas and Bases to optional local views
  standards/learning-content-quality.md:
    adapted_from:
      - https://github.com/mattpocock/skills/tree/84fdeffd12f2ee307994d1eb6feb48173b6e0502/skills/in-progress/writing-shape
      - https://github.com/mattpocock/skills/tree/84fdeffd12f2ee307994d1eb6feb48173b6e0502/skills/in-progress/writing-beats
      - https://github.com/mattpocock/skills/tree/84fdeffd12f2ee307994d1eb6feb48173b6e0502/skills/productivity/teach
    changed: translated the useful prerequisite and grounding model into a provider-neutral section dependency contract, removed interactive article shaping and HTML defaults, and added adversarial insertion and cycle gates after a fresh-context baseline failed 2 of 3 cases
skills:
  skills/architecture/domain:
    adapted_from:
      - https://learn.microsoft.com/en-us/azure/architecture/microservices/model/domain-analysis
      - https://learn.microsoft.com/en-us/azure/architecture/microservices/model/tactical-ddd
    changed: separated business modeling from framework and persistence, made aggregate a measured transaction consistency boundary, and routed atomicity to the single $tx owner
  skills/backend/tx:
    adapted_from:
      - https://www.postgresql.org/docs/current/transaction-iso.html
      - https://www.postgresql.org/docs/current/applevel-consistency.html
      - https://aws.amazon.com/builders-library/making-retries-safe-with-idempotent-APIs/
      - https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/transactional-outbox.html
      - https://www.rfc-editor.org/rfc/rfc9110.html#section-9.2.2
    changed: established one Woon owner for local transaction, isolation, caller-owned idempotency, atomic claim and mutation, unknown results, outbox/inbox and deterministic crash-window verification
  skills/backend/event:
    adapted_from:
      - https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/transactional-outbox.html
      - https://kafka.apache.org/documentation/#semantics
      - https://opentelemetry.io/docs/specs/semconv/messaging/messaging-spans/
    changed: limited exactly-once claims to their proven scope and made duplicate, ordering, ack, replay and end-to-end business effects explicit while delegating atomicity to $tx
  skills/backend/resilience:
    adapted_from:
      - https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/
      - https://docs.aws.amazon.com/wellarchitected/latest/framework/rel_mitigate_interaction_failure_limit_retries.html
      - https://sre.google/sre-book/handling-overload/
    changed: created one failure-policy owner for end-to-end deadlines, single retry ownership, bounded budgets, isolation, load shedding and contract-preserving fallbacks
  skills/data/cache:
    adapted_from:
      - https://redis.io/docs/latest/develop/clients/client-side-caching/
      - https://redis.io/docs/latest/develop/clients/patterns/distributed-locks/
      - https://redis.io/docs/latest/develop/reference/eviction/
    changed: made source ownership, stale age, versioned invalidation, stampede control, fencing and cache-outage correctness mandatory instead of prescribing Redis defaults
  skills/ops/observe:
    adapted_from:
      - https://opentelemetry.io/docs/specs/semconv/general/trace/
      - https://opentelemetry.io/docs/specs/semconv/messaging/messaging-spans/
      - https://sre.google/sre-book/service-level-objectives/
    changed: unified logical operation and physical attempt evidence across logs, metrics and traces while separating tamper-sensitive audit records and privacy
  skills/ops/capacity:
    adapted_from:
      - https://sre.google/sre-book/handling-overload/
      - https://sre.google/sre-book/service-level-objectives/
    changed: required measured workload distributions, bounded queues, explicit backpressure and overload contracts without copying arbitrary pool or batch sizes
  skills/security/auth:
    adapted_from:
      - https://www.rfc-editor.org/rfc/rfc9700.html
      - https://openid.net/specs/openid-connect-core-1_0.html
    changed: created a framework-independent owner for OAuth and OIDC flow, token lifecycle and object-level authorization while leaving framework configuration to language skills
  skills/backend/protocol:
    adapted_from:
      - https://grpc.io/docs/guides/deadlines/
      - https://spec.graphql.org/
      - https://www.rfc-editor.org/rfc/rfc6455.html
      - https://www.rfc-editor.org/rfc/rfc9457.html
    changed: separated non-REST interaction contracts from $api and required compatibility, flow control, reconnect, authorization and failure tests per protocol
  skills/data/storage:
    adapted_from:
      - https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/data-store-overview
      - https://learn.microsoft.com/en-us/azure/architecture/microservices/design/data-considerations
    changed: made access pattern, consistency, durability, partitioning, restore and canonical ownership the decision inputs instead of product popularity
  skills/backend/tenant:
    adapted_from:
      - https://learn.microsoft.com/en-us/azure/architecture/guide/multitenant/considerations/tenancy-models
      - https://learn.microsoft.com/en-us/azure/architecture/guide/multitenant/approaches/storage-data
      - https://learn.microsoft.com/en-us/azure/architecture/guide/multitenant/approaches/compute
    changed: treated tenant identity as verified security context and required isolation across data, cache, queues, jobs, telemetry, capacity and migration
  skills/backend/job:
    adapted_from:
      - https://learn.microsoft.com/en-us/azure/architecture/patterns/competing-consumers
      - https://docs.temporal.io/workflows
    changed: created a provider-neutral durable state machine, lease and fencing, checkpoint, retry, cancellation and operational replay contract
  skills/security/privacy:
    adapted_from:
      - https://www.nist.gov/privacy-framework
      - https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
    changed: connected data inventory, minimization, retention, export and deletion across caches, projections, logs, queues and backups while requiring jurisdiction-specific policy verification
  skills/web/css:
    adapted_from:
      - https://github.com/AllThingsSmitty/css-protips/tree/e95123993037bbcd1bd97170cfa02087155c3690
      - https://developer.mozilla.org/en-US/docs/Web/CSS/Guides/Cascade/Specificity
      - https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/content
      - https://web.dev/articles/baseline-in-action-fluid-type
    changed: separated pure CSS from React and rendered UI testing, retained portable low-specificity and logical-layout practices, and converted universal reset, generated-content, hidden-media and viewport-type tips into explicit accessibility and behavior gates
  skills/writing/tech:
    adapted_from:
      - https://github.com/mattpocock/skills/tree/84fdeffd12f2ee307994d1eb6feb48173b6e0502/skills/in-progress/writing-shape
      - https://github.com/mattpocock/skills/tree/84fdeffd12f2ee307994d1eb6feb48173b6e0502/skills/in-progress/writing-beats
    changed: made the shared learning standard an explicit user-approved acceptance gate at the invocation boundary so direct glossary-first, append-only and cyclic-order pressure cannot silently bypass it
  skills/ai/agent-audit:
    adapted_from:
      - https://github.com/affaan-m/ECC/tree/2d46e80e0925c7be0907f18c1812311ac212a6c5/skills/agent-architecture-audit
    changed: shortened provider-neutral code-first trace contract, separated conditional layer reference, removed mandatory activation and ECC-specific tools, then admitted only after a fresh-context baseline failure
  skills/common/quality:
    adapted_from:
      - https://github.com/multica-ai/andrej-karpathy-skills/tree/2c606141936f1eeef17fa3043a72095b4765b9c2/skills/karpathy-guidelines
    changed: retained one Woon quality owner, translated four compact execution principles, limited clarification to material ambiguity, preserved mandatory security and compatibility, included required propagation in narrow changes, and delegated tests, evidence and effects to their existing owners
  skills/common/terminal:
    adapted_from: vendor/ecc/terminal-ops
    changed: removed automatic commit and push behavior
  skills/common/verify:
    adapted_from: vendor/ecc/verification-loop
    changed: evidence layers and explicit unverified boundaries
  skills/common/safety:
    adapted_from: vendor/ecc/safety-guard
    changed: destructive and external authorization gates
  skills/docs/lookup:
    adapted_from: vendor/ecc/documentation-lookup
    changed: official version-matched sources only
  skills/knowledge/knowledge:
    replaces: vendor/ecc/knowledge-ops
    changed: private canonical Woon MCP, corpus excerpt routing, no automatic sync or push
  skills/skill-system/audit:
    adapted_from:
      - vendor/ecc/skill-stocktake
      - https://github.com/agentskills/agentskills
      - https://github.com/microsoft/waza
    changed: deterministic Woon metadata, generated catalog, source, profile, routing coverage and severity checks
  skills/skill-system/comply:
    adapted_from:
      - vendor/ecc/skill-comply
      - https://github.com/microsoft/waza
      - https://github.com/microsoft/skills
      - https://github.com/anthropics/skills
      - https://github.com/addyosmani/agent-skills
      - https://github.com/obra/superpowers/tree/44c9b2d6e889982ac18c27d05a19fefe335194e1/skills/writing-skills
    changed: provider-neutral no-guidance baseline, fresh-context trials, deterministic-first evidence, adversarial held-out probes, hard failure gates and measured token trade-offs
  skills/skill-system/budget:
    adapted_from:
      - vendor/ecc/context-budget
      - https://github.com/agentskills/agentskills
      - https://github.com/microsoft/waza
    changed: provider-specific actual usage, layered context accounting, baseline percentiles and quality-gated deltas
  skills/skill-system/registry:
    adapted_from:
      - https://github.com/agentskills/agentskills
      - https://github.com/microsoft/waza
    changed: Woon-first root catalog, shortest routable names, Codex and Claude shared source, lifecycle and evaluation-only profiles
  skills/web/react:
    adapted_from:
      - vendor/ecc/frontend-patterns
      - https://github.com/vercel-labs/agent-skills
    changed: repository-first React ownership and measured optimization
  skills/language/typescript/ts:
    adapted_from:
      - https://github.com/google/styleguide/blob/1809c769de31ba388c755ad15dd057a9ba8531fd/tsguide.html
    changed: retained Woon module and runtime ownership, separated strict Google file naming from repository defaults, and moved import, declaration, type and documentation detail into a Korean conditional reference
  skills/language/java/java:
    adapted_from:
      - https://github.com/google/styleguide/blob/1809c769de31ba388c755ad15dd057a9ba8531fd/javaguide.html
    changed: retained Woon package and type design, added explicit import, overload, modifier, naming and Javadoc rules as a conditional Korean reference
  skills/language/python/python:
    adapted_from:
      - https://github.com/google/styleguide/blob/1809c769de31ba388c755ad15dd057a9ba8531fd/pyguide.md
    changed: retained Woon module ownership and compatibility, added formatter-aware import, function placement, naming, resource and typing rules as a conditional Korean reference
  skills/language/c/c:
    adapted_from:
      - https://wiki.sei.cmu.edu/confluence/display/c/Introduction
      - https://www.gnu.org/prep/standards/html_node/Writing-C.html
      - https://github.com/google/styleguide/tree/1809c769de31ba388c755ad15dd057a9ba8531fd
    changed: created an independent repository-first C owner for headers, linkage, ownership, errors and safety while explicitly recording that Google provides no standalone C guide
  skills/language/cpp/cpp:
    adapted_from:
      - https://github.com/google/styleguide/blob/1809c769de31ba388c755ad15dd057a9ba8531fd/cppguide.html
    changed: created a short C++ owner and split API, ownership and lifetime design from strict include, access, declaration, naming and formatting conventions
  skills/language/csharp/cs:
    adapted_from:
      - https://github.com/google/styleguide/blob/1809c769de31ba388c755ad15dd057a9ba8531fd/csharp-style.md
    changed: created a short C# owner, retained useful naming and organization rules, and replaced outdated language-version choices with current SDK, nullable, analyzer and async contracts
  skills/web/e2e:
    adapted_from:
      - vendor/ecc/e2e-testing
      - https://github.com/microsoft/playwright-cli
    changed: stable user-facing locators and evidence capture
  skills/common/test:
    adapted_from:
      - https://github.com/obra/superpowers/tree/44c9b2d6e889982ac18c27d05a19fefe335194e1/skills/test-driven-development
      - https://github.com/obra/superpowers/blob/44c9b2d6e889982ac18c27d05a19fefe335194e1/skills/test-driven-development/writing-good-tests.md
    changed: shortened provider-neutral test contract, practical handling of existing implementations, independent expectations, minimal test doubles and mutation evidence
  skills/novel/novel-handoff:
    native_for: Woon private novel continuity across local and external AI sessions
    changed: created one prompt-only owner with local-full default, de-identified external derivation, bounded context, immutable originals and no external transmission authority
  skills/novel/novel-merge:
    native_for: Woon private novel conversation reconciliation
    changed: created one canonical merge owner for typed claims, event lineage, linear chronology, complete disposition inventory and a single local-only source catalog without original duplication
  skills/productivity/tasks:
    native_for: Woon local-first personal task and read-only Apple Calendar workflow
    changed: created one owner for purpose-bound Markdown routines, KST daily materialization, local receipt verification and read-only ICS projection while rejecting app UI, direct databases and provider-specific task systems
  skills/knowledge/people:
    native_for: Woon local-first person, source attribution and meeting-role indexing
    changed: created one role-aware person-card owner with implicit vault ownership, explicit-or-repeated card creation, local MCP verification, unresolved attribution and Novel exclusion
  skills/writing/site-promotion:
    native_for: Woon private knowledge to public site promotion with human approval
    changed: created one review-queue owner for evidence-ledger transformation, distinct blog and portfolio genres, selected portfolio visibility, architecture media, exact source-write approval and separate commit, push and deploy authority
