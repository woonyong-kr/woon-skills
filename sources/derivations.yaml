version: 1
standards:
  standards/obsidian-compatibility.md:
    adapted_from:
      - https://github.com/kepano/obsidian-skills/tree/a1dc48e68138490d522c04cbf5822214c6eb1202/skills/obsidian-markdown
      - https://github.com/kepano/obsidian-skills/tree/a1dc48e68138490d522c04cbf5822214c6eb1202/skills/json-canvas
      - https://github.com/kepano/obsidian-skills/tree/a1dc48e68138490d522c04cbf5822214c6eb1202/skills/obsidian-bases
    changed: separated MCP envelope from Markdown body, restricted links by verified canonical ID and visibility, kept Mermaid canonical, and demoted Canvas and Bases to optional local views
  standards/learning-content-quality.md:
    adapted_from:
      - https://github.com/mattpocock/skills/tree/84fdeffd12f2ee307994d1eb6feb48173b6e0502/skills/in-progress/writing-shape
      - https://github.com/mattpocock/skills/tree/84fdeffd12f2ee307994d1eb6feb48173b6e0502/skills/in-progress/writing-beats
      - https://github.com/mattpocock/skills/tree/84fdeffd12f2ee307994d1eb6feb48173b6e0502/skills/productivity/teach
    changed: translated the useful prerequisite and grounding model into a provider-neutral section dependency contract, removed interactive article shaping and HTML defaults, and added adversarial insertion and cycle gates after a fresh-context baseline failed 2 of 3 cases
skills:
  skills/writing/tech:
    adapted_from:
      - https://github.com/mattpocock/skills/tree/84fdeffd12f2ee307994d1eb6feb48173b6e0502/skills/in-progress/writing-shape
      - https://github.com/mattpocock/skills/tree/84fdeffd12f2ee307994d1eb6feb48173b6e0502/skills/in-progress/writing-beats
    changed: made the shared learning standard an explicit user-approved acceptance gate at the invocation boundary so direct glossary-first, append-only and cyclic-order pressure cannot silently bypass it
  skills/ai/agent-audit:
    adapted_from:
      - https://github.com/affaan-m/ECC/tree/2d46e80e0925c7be0907f18c1812311ac212a6c5/skills/agent-architecture-audit
    changed: shortened provider-neutral code-first trace contract, separated conditional layer reference, removed mandatory activation and ECC-specific tools, then admitted only after a fresh-context baseline failure
  skills/common/terminal:
    adapted_from: vendor/ecc/terminal-ops
    changed: removed automatic commit and push behavior
  skills/common/verify:
    adapted_from: vendor/ecc/verification-loop
    changed: evidence layers and explicit unverified boundaries
  skills/common/safety:
    adapted_from: vendor/ecc/safety-guard
    changed: destructive and external authorization gates
  skills/docs/lookup:
    adapted_from: vendor/ecc/documentation-lookup
    changed: official version-matched sources only
  skills/knowledge/knowledge:
    replaces: vendor/ecc/knowledge-ops
    changed: private canonical Woon MCP, corpus excerpt routing, no automatic sync or push
  skills/skill-system/audit:
    adapted_from:
      - vendor/ecc/skill-stocktake
      - https://github.com/agentskills/agentskills
      - https://github.com/microsoft/waza
    changed: deterministic Woon metadata, generated catalog, source, profile, routing coverage and severity checks
  skills/skill-system/comply:
    adapted_from:
      - vendor/ecc/skill-comply
      - https://github.com/microsoft/waza
      - https://github.com/microsoft/skills
      - https://github.com/anthropics/skills
      - https://github.com/addyosmani/agent-skills
      - https://github.com/obra/superpowers/tree/44c9b2d6e889982ac18c27d05a19fefe335194e1/skills/writing-skills
    changed: provider-neutral no-guidance baseline, fresh-context trials, deterministic-first evidence, adversarial held-out probes, hard failure gates and measured token trade-offs
  skills/skill-system/budget:
    adapted_from:
      - vendor/ecc/context-budget
      - https://github.com/agentskills/agentskills
      - https://github.com/microsoft/waza
    changed: provider-specific actual usage, layered context accounting, baseline percentiles and quality-gated deltas
  skills/skill-system/registry:
    adapted_from:
      - https://github.com/agentskills/agentskills
      - https://github.com/microsoft/waza
    changed: Woon-first root catalog, shortest routable names, Codex and Claude shared source, lifecycle and evaluation-only profiles
  skills/web/react:
    adapted_from:
      - vendor/ecc/frontend-patterns
      - https://github.com/vercel-labs/agent-skills
    changed: repository-first React ownership and measured optimization
  skills/web/e2e:
    adapted_from:
      - vendor/ecc/e2e-testing
      - https://github.com/microsoft/playwright-cli
    changed: stable user-facing locators and evidence capture
  skills/common/test:
    adapted_from:
      - https://github.com/obra/superpowers/tree/44c9b2d6e889982ac18c27d05a19fefe335194e1/skills/test-driven-development
      - https://github.com/obra/superpowers/blob/44c9b2d6e889982ac18c27d05a19fefe335194e1/skills/test-driven-development/writing-good-tests.md
    changed: shortened provider-neutral test contract, practical handling of existing implementations, independent expectations, minimal test doubles and mutation evidence
