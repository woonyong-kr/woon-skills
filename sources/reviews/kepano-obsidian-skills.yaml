groups:
  - id: markdown-contract
    skills: [obsidian-markdown]
    purpose: render portable Markdown with wikilinks, callouts, properties and embeds
    overlap: archive, publish, diagram and the Woon knowledge adapter already own metadata, privacy and canonical links
    decision: merge-into-skill-system
    reason: retain only the verified Obsidian and Quartz intersection, with envelope and visibility rules stronger than upstream defaults
  - id: optional-local-views
    skills: [json-canvas, obsidian-bases]
    purpose: provide visual canvases and computed local note views
    overlap: diagram owns explanatory Mermaid while the knowledge system owns canonical Markdown and generated indexes
    decision: retain-split-owners
    reason: Canvas and Bases remain explicit optional outputs and never replace portable Markdown, canonical relations or public rendering evidence
  - id: external-processes
    skills: [obsidian-cli, defuddle]
    purpose: mutate or inspect a vault through Obsidian CLI and install a web extraction CLI
    overlap: Woon MCP owns revision-safe knowledge access and existing web tools own retrieval
    decision: reject-active-skill
    reason: direct vault mutation and global CLI installation add process, network and canonical-drift risk without an observed behavior gap
