groups:
  - id: react-web-regressions
    skills: [composition-patterns, react-best-practices]
    purpose: component API, state ownership, async rendering, bundle, rerender and server safety guidance
    overlap: skills/web/react and common quality, security and verification owners
    decision: adopt-as-test
    reason: the six adversarial boundaries already passed in Codex and Claude, so Woon records them as provider-neutral regression cases without adding competing composition or performance skills
  - id: mobile-and-transition-specialists
    skills: [react-native-skills, react-view-transitions]
    purpose: React Native performance and experimental browser or React view transitions
    overlap: the React owner shares state and component principles, but native navigation, Reanimated and transition APIs are version-specific
    decision: evaluate-no-change
    reason: no active Woon repository or profile currently requires these platforms, and universal claims such as virtualize any list would weaken the measured and version-aware quality contract
  - id: unsafe-deployment-automation
    skills: [deploy-to-vercel, vercel-cli-with-tokens]
    purpose: link, deploy and manage Vercel projects through Git, CLI tokens or an unauthenticated upload service
    overlap: terminal, safety, commit, GitHub and future deployment ownership
    decision: reject-active-skill
    reason: broad git add and push, token-printing discovery, user-supplied secret requests and instructions not to verify the live URL conflict with narrow staging, secret redaction, explicit external authority and deployment evidence
  - id: deterministic-vercel-audit
    skills: [vercel-optimize]
    purpose: collect scoped production metrics, gate candidates and verify version-aware Vercel cost and performance recommendations
    overlap: budget, verify and React performance, but requires Vercel account state, CLI linkage and a large bundled deterministic tool
    decision: evaluate-no-change
    reason: the implementation is well tested but has no current linked project requirement, the repository license boundary is incomplete and importing 156 files would add a large platform-specific maintenance surface; reconsider behind a dedicated optional profile when an actual Vercel audit is requested
  - id: volatile-remote-handbooks
    skills: [web-design-guidelines, writing-guidelines]
    purpose: fetch the latest Vercel-owned UI or prose handbook on every review
    overlap: ui-test, docs and tech owners
    decision: retain-existing
    reason: mutable remote instructions are not a reproducible Woon canonical source; existing owners keep rendered UI evidence and source-backed document structure without adding vendor voice or duplicate routing
