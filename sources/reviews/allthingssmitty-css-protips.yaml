tip_inventory:
  - Use a CSS Reset
  - Inherit box-sizing
  - Use unset Instead of Resetting All Properties
  - Use not to Apply or Unapply Borders on Navigation
  - Check if Font Is Installed Locally
  - Add line-height to body
  - Set focus for Form Elements
  - Vertically-Center Anything
  - Use aspect-ratio Instead of Height or Width
  - Comma-Separated Lists
  - Select Items Using Negative nth-child
  - Use SVG for Icons
  - Use the Lobotomized Owl Selector
  - Use max-height for Pure CSS Sliders
  - Equal-Width Table Cells
  - Get Rid of Margin Hacks With Flexbox
  - Use Attribute Selectors with Empty Links
  - Control Specificity Better with is
  - Style Default Links
  - Intrinsic Ratio Boxes
  - Style Broken Images
  - Use rem for Global Sizing and em for Local Sizing
  - Hide Autoplay Videos That Are Not Muted
  - Use root for Flexible Type
  - Set font-size on Form Elements for a Better Mobile Experience
  - Use Pointer Events to Control Mouse Events
  - Set display none on Line Breaks Used as Spacing
  - Use empty to Hide Empty HTML Elements
  - Use margin-inline instead of margin
