groups:
  - id: existing-language-guides
    skills: [typescript-style-guide, java-style-guide, python-style-guide]
    purpose: define source, import, declaration, naming, documentation and language-safety conventions
    overlap: existing ts, java and python owners already define module and type design but lacked an attributed comprehensive style layer
    decision: retain-existing
    reason: add Korean conditional convention references without creating google-ts, google-java or google-python routing duplicates
  - id: missing-language-owners
    skills: [cpp-style-guide, csharp-style-guide]
    purpose: define C++ and C# language-specific files, types, member order, visibility, ownership and modern runtime contracts
    overlap: quality and naming are language-neutral and cannot safely own C++ lifetime or C# nullable and async behavior
    decision: adopt-as-new-skill
    reason: add short cpp and cs owners with detailed on-demand references rather than placing both languages in one generic convention skill
  - id: c-non-guide
    skills: [google-c-style-el]
    purpose: configure an editor indentation mode called Google C style
    overlap: it does not define C API, ownership, safety, file placement or error contracts
    decision: reject
    reason: do not mislabel an editor configuration or the C++ guide as official Google C guidance; create an independent c owner with C-only sources
