skills:
  - name: openclaw-memory-tencentdb-setup
    purpose: install, configure, restart and smoke-test the OpenClaw memory-tencentdb plugin
    overlap: knowledge and archive already own Woon memory behavior, while terminal, safety and verify own installation effects and evidence
    decision: retain-existing
    reason: this OpenClaw-specific installer creates a second memory canonical and automatic recall surface; the pinned package also lacks reproducible tests and a complete build
  - name: openclaw-diagnostic-export
    purpose: package OpenClaw logs, configuration and the complete L0 to L3 memory store for manual support sharing
    overlap: knowledge privacy, research evidence and safety already require exact source, minimization and separate authority for external sharing
    decision: adopt-as-test
    reason: keep the distinction between configuration redaction and raw-memory privacy as a regression, but reject the unusable workflow because its required export script is absent and the archive contains full conversations and persona data
  - name: openclaw-memory-tencentdb-migration
    purpose: migrate plugin identity while backing up configuration, retaining data, verifying counts and providing rollback
    overlap: safety and verify already own bounded backups, secrets, before-after evidence and rollback
    decision: adopt-as-test
    reason: preserve the useful before-after and rollback gates as a safety case, while rejecting plaintext secret output, unprotected temp backups and provider-specific package mutation as an active skill
