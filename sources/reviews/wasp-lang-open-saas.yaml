skills:
  - name: add-wasp-skills
    purpose: fetch mutable installation instructions and install all skills from the separate Wasp plugin repository
    overlap: registry already owns source pinning, license, overlap, provider routing, token and approval before installation
    decision: reject-active-skill
    reason: it delegates trust to a moving main branch and bulk-installs six overlapping skills, including always-on AGENTS injection, a hidden opt-out marker hook, external MCP setup and deployment effects
  - name: getting-started
    purpose: fetch current docs, install Wasp if missing and offer to start PostgreSQL, migrations and the development app
    overlap: terminal, safety and verify own environment mutation and live-service evidence; project-local docs can be read directly when a Wasp project is active
    decision: retain-existing
    reason: no current Woon repository uses Wasp, and a generic startup skill would route too broadly; retain the useful version-aware documentation requirement as a frontend regression instead
  - name: guided-tour
    purpose: fetch a mutable guided tour and pause section by section while explaining the Open SaaS structure and features
    overlap: tech and learning-content standards already own source-backed, linear explanation with code, causal diagrams and verification
    decision: retain-existing
    reason: the tour is Wasp-template-specific, its current example already drifts from the template version and mandatory pauses add interaction and token cost without improving the shared documentation owner
