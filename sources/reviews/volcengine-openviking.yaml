groups:
  - id: retrieval-memory-and-session
    skills:
      - benchmark/experience-loader
      - codex/ov-experience-memory
      - cursor/openviking-memory
      - openclaw/openviking-context-database
      - openclaw/ov-experience-memory
      - examples/ov-experience-memory
      - examples/ov-dream
    purpose: retrieve prior experience, auto-capture sessions, inject memory and synchronize historical context
    overlap: Woon knowledge and archive already own private canonical search, excerpt reading, revisioned merge, audit, history and restore through on-demand MCP
    decision: adopt-as-test
    reason: preserve current-evidence, applicability and partial-completion gates as offline cases; reject automatic every-turn recall, hard-coded default users, transcript synchronization and a second mutable canonical store
  - id: installation-and-server-operations
    skills:
      - openclaw/install-openviking-memory
      - examples/ov-server-operate
    purpose: install, configure, restart, upgrade, clean and troubleshoot OpenViking or its OpenClaw plugin
    overlap: terminal and safety own prerequisite inspection, configuration effects, service changes and destructive recovery
    decision: reject-active-skill
    reason: provider-specific installation is not required, while npx latest, curl-pipe-shell, force restart, pkill -9 and recursive data cleanup create unneeded supply-chain and data-loss risk
  - id: resource-paper-and-skill-store
    skills:
      - examples/ov-add-paper
      - examples/ov-resources
      - examples/ov-skills
    purpose: ingest papers and resources, manage skill content and replace or remove stored items
    overlap: archive, research, registry and the PDF learning standard already separate evidence, canonical ownership, Obsidian Markdown and portable Mermaid diagrams
    decision: retain-existing
    reason: a parallel resource and skill store would break single ownership; mandatory PNG extraction also conflicts with the portable text and diagram standard, while in-place update and remove lack Woon revision guarantees
  - id: generic-bot-utilities
    skills:
      - bot/cron
      - bot/github-proxy
      - bot/github
      - bot/opencode
      - bot/skill-creator
      - bot/summarize
      - bot/tmux
      - bot/weather
    purpose: scheduling, GitHub access, coding-agent delegation, summarization, terminal sessions, weather and skill authoring
    overlap: existing Woon and installed owners already cover automation, GitHub, terminal, skill-system, research and verification with narrower authority
    decision: retain-existing
    reason: these generic utilities are shallower than current owners; the proxy weakens source integrity, summarization can send private files to external providers and tmux includes unsafe autonomous and destructive commands
