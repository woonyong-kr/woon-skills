groups:
  - id: measured-learning-gap
    skills: [teach, writing-beats, writing-shape]
    purpose: preserve prerequisite and concept grounding across a linear learning document
    overlap: shared learning-content standard used by docs and tech
    decision: merge-into-skill-system
    reason: fresh-context adversarial prompts failed 2 of 3 ordering cases, so the minimal provider-neutral grounding contract and held-out cases were merged without adding an always-routable skill
  - id: existing-woon-owners
    skills: [code-review, codebase-design, diagnosing-bugs, domain-modeling, improve-codebase-architecture, research, tdd, to-spec, to-tickets, triage, wayfinder, writing-for-agents]
    purpose: review code, architecture, bugs, domain terms, research, tests, planning and agent-facing documents
    overlap: review, quality, hexagonal, terminal, verify, naming, research, test, GitHub and skill-system owners
    decision: retain-existing
    reason: current Woon behavior passed domain conflict and reference-routing baselines; duplicating these skills would add context and competing ownership without a measured gain
  - id: conflicting-automation
    skills: [grill-with-docs, implement, prototype, resolving-merge-conflicts, git-guardrails-claude-code, grill-me, grilling]
    purpose: force questioning or automate implementation, commits, conflict resolution and prototype shortcuts
    overlap: autonomy, safety, test and commit contracts
    decision: reject-active-skill
    reason: mandatory exhaustive questioning, automatic commits, never-abort conflict handling and test-free prototypes contradict explicit user authority, preservation and verification gates
  - id: specialized-or-unproven
    skills: [ask-matt, setup-matt-pocock-skills, wizard, claude-handoff, loop-me, setup-ts-deep-modules, writing-fragments, migrate-to-shoehorn, scaffold-exercises, setup-pre-commit, handoff, to-questionnaire, wait-what]
    purpose: provide author-specific advice, provider setup, interactive scripts, handoffs, loops, TS tooling and writing utilities
    overlap: repository-specific setup and optional productivity workflows
    decision: evaluate-no-change
    reason: several are in-progress, provider-specific or tied to a particular repository and no current Woon behavior gap or cross-executor evidence justifies active routing
