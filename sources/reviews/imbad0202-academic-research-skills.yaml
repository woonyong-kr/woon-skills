groups:
  - id: evidence-integrity
    skills: [deep-research]
    purpose: distinguish source existence from claim support, bound search coverage and expose contradictions or absent evidence
    overlap: research already owns multi-source synthesis, temporal verification, primary-source preference and uncertainty reporting
    decision: adopt-as-test
    reason: retain claim entailment, empirical provenance and no-evidence behavior as provider-neutral regressions because fresh Codex and Claude controls already pass
  - id: academic-authoring
    skills: [academic-paper]
    purpose: plan, draft, revise, format and disclose an academic manuscript through a multi-agent workflow
    overlap: tech, docs and diagram own Woon technical learning documents while no current profile requires journal submission automation
    decision: reject-active-skill
    reason: the 10631-token skill, venue-specific mandates and provider orchestration are disproportionate to current needs; a paper-specific owner should be proposed only after a real manuscript control exposes a gap
  - id: academic-peer-review
    skills: [academic-paper-reviewer]
    purpose: simulate a multi-perspective journal review and verify revisions against prior findings
    overlap: review owns code review only, so academic peer review would be a distinct optional domain rather than a merge target
    decision: reject-active-skill
    reason: simulated panels cannot confer peer-review authority, and no measured Woon task currently justifies a 7589-token active skill or its seven-agent execution cost
  - id: academic-orchestrator
    skills: [academic-pipeline]
    purpose: coordinate research, drafting, integrity checks, peer review, revision and finalization
    overlap: Woon uses small task profiles and explicit owners instead of one provider-specific end-to-end controller
    decision: reject-active-skill
    reason: the 10332-token orchestration layer duplicates routing, creates many mandatory turns and has two pending native eval tasks; Woon retains only independently testable evidence boundaries
