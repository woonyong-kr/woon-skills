name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: woon/woon-skills
      - name: Audit generated skill catalog
        shell: bash
        working-directory: woon/woon-skills
        run: python scripts/audit_skills.py
      - name: Resolve locked woon release
        id: toolchain
        shell: bash
        working-directory: woon/woon-skills
        run: |
          ref="$(awk '$1 == "woon:" { print $2 }' lock/toolchain.yaml)"
          version="${ref#v}"
          if [[ "$ref" != "v$version" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid woon lock: $ref" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: woonyong-kr/woon-core
          ref: ${{ steps.toolchain.outputs.ref }}
          path: woon/woon-core
      - uses: actions/setup-go@v7
        with:
          go-version-file: woon/woon-core/go.mod
          cache: true
          cache-dependency-path: woon/woon-core/go.sum
      - name: Build locked woon
        shell: bash
        working-directory: woon/woon-core
        run: >-
          go build -trimpath
          -ldflags="-X github.com/woonyong-kr/woon-core/internal/buildinfo.Version=${{ steps.toolchain.outputs.version }}"
          -o ../../woon-cli ./cmd/woon
      - name: Validate core profile
        shell: bash
        working-directory: woon/woon-core
        run: ../../woon-cli --root .. skills validate --profile core
      - name: Validate composed profiles
        shell: bash
        working-directory: woon/woon-core
        run: |
          ../../woon-cli --root .. skills validate --profile core,python
          ../../woon-cli --root .. skills validate --profile core,web
          ../../woon-cli --root .. skills validate --profile core,publishing
          ../../woon-cli --root .. skills validate --profile core,knowledge
          ../../woon-cli --root .. skills validate --profile core,container
          ../../woon-cli --root .. skills validate --profile core,review

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
