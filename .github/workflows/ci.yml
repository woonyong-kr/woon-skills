name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: woon/woon-skills
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: woon/woon-skills/requirements-ci.txt
      - name: Install audit dependencies
        shell: bash
        working-directory: woon/woon-skills
        run: python -m pip install --requirement requirements-ci.txt
      - name: Audit generated skill catalog
        shell: bash
        working-directory: woon/woon-skills
        run: |
          python scripts/audit_skills.py
          python -m pytest -q
      - name: Resolve locked woon revision
        id: toolchain
        shell: bash
        working-directory: woon/woon-skills
        run: |
          ref="$(awk '$1 == "woon:" { print $2 }' lock/toolchain.yaml)"
          commit="$(awk '$1 == "woon_commit:" { print $2 }' lock/toolchain.yaml)"
          version="${ref#v}"
          if [[ "$ref" != "v$version" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid woon lock: $ref" >&2
            exit 1
          fi
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid woon commit lock: $commit" >&2
            exit 1
          fi
          echo "version=$version+${commit:0:8}" >> "$GITHUB_OUTPUT"
          echo "ref=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: woonyong-kr/woon-core
          ref: ${{ steps.toolchain.outputs.ref }}
          path: woon/woon-core
      - name: Install locked woon
        shell: bash
        working-directory: woon/woon-core
        run: python -m pip install .
      - name: Validate core profile
        shell: bash
        working-directory: woon/woon-core
        run: woon --root .. skills validate --profile core
      - name: Validate composed profiles
        shell: bash
        working-directory: woon/woon-core
        run: |
          woon --root .. skills validate --profile core,python
          woon --root .. skills validate --profile core,web
          woon --root .. skills validate --profile core,publishing
          woon --root .. skills validate --profile knowledge
          woon --root .. skills validate --profile core,container
          woon --root .. skills validate --profile core,review
          woon --root .. skills validate --profile core,ai

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
