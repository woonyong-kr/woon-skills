purpose: 현재 승인된 한국어 기술 학습 표본에서 추출한 문체·전개 패턴의 근거를 교체 가능한 ID로 관리한다.
source_policy:
  - 원문 문장, 코드, 그림을 복제하지 않는다.
  - 표본의 이름과 경로는 이 저장소에 고정하지 않는다.
  - 자료를 교체할 때는 같은 역할의 표본을 다시 읽고 digest, reviewed_pages, observations를 갱신한다.
  - 이 파일의 observation은 사실·표현·구성 패턴의 요약이며, 원문을 대체하는 출처가 아니다.
