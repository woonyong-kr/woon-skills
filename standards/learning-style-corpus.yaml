observations:
  - 관찰 가능한 작은 프로그램이나 상태에서 시작하고, 정의보다 먼저 독자가 이상함이나 반복을 보게 한다.
  - 코드와 실행 결과를 같은 장면으로 묶은 뒤, 결과의 한 줄을 다시 집어 원인을 순서대로 분석한다.
  - 용어는 필요가 생긴 직후에 한국어 역할과 원어 이름을 함께 소개하고, 아직 깊게 다룰 내용은 현재 이해 범위를 명시한다.
  - 해결책은 새 코드만 제시하지 않고 기존 장면과 같은 입력·값으로 다시 실행해 달라진 결과를 비교한다.
  - 제목은 개념 이름만 반복하지 않고 시작, 예제, 문제, 해결, 정리처럼 독자가 현재 어느 사고 단계에 있는지 알려 준다.
  - 문장은 설명자의 관찰, 독자의 예상, 실제 결과를 번갈아 놓고, 질문은 이해의 빈칸이 생긴 직후에만 사용한다.
  - 정리는 앞 문장을 축약하기보다 지금 이해하면 충분한 범위와 나중에 다시 만날 연결점을 남긴다.
