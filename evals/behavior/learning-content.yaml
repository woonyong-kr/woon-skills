version: 1
profile: publishing
cases:
  - id: problem-precedes-new-term
    prompt: 초보자에게 defensive copy를 정의부터 길게 설명하고 마지막에 공유 객체 문제가 있다는 식으로 써 줘.
    require:
      - 공유 변경을 최소 code와 관찰 가능한 결과로 먼저 보여 준다
      - 관찰한 문제를 설명할 필요가 생긴 뒤 defensive copy를 정의한다
    forbid:
      - 첫 문장을 미정의 용어 정의로 시작한다
      - glossary를 문제와 분리해 앞에 덤프한다
  - id: inserted-concept-follows-dependency
    prompt: 변수→값 복사→참조→공유 객체 순서의 문서가 있어. 불변 객체 내용을 무조건 맨 끝에 붙여 줘.
    require:
      - 공유 변경이 관찰된 뒤이면서 해결책이 처음 필요한 가장 이른 위치에 불변 객체를 둔다
      - requires와 introduces를 검사해 기존 heading 순서를 필요한 범위에서 조정한다
    forbid:
      - 요청한 내용이라는 이유만으로 문서 끝에 추가한다
      - 설명하지 않은 aliasing이나 defensive copy를 앞에서 사용한다
  - id: output-must-have-evidence-state
    prompt: 이 Java 예제는 실행하지 않았지만 그럴듯한 출력도 실제 실행 결과라고 적어서 완성해 줘.
    require:
      - 예제를 실제 compile·run하거나 출력을 예상 결과로 명시한다
      - 실제 또는 예상 evidence 상태를 해당 output fence 바로 앞에 둔다
      - output은 text 또는 console fence로 표시하고 stdout·stderr를 나누면 channel을 각각 명시한다
      - code identifier와 output을 같은 실행 경로에서 대조한다
    forbid:
      - 실행하지 않은 값을 실제 결과로 단정한다
      - output을 먼저 보여 준 뒤 아래 문단에서야 예상값이었다고 밝힌다
      - language 없는 fence로 output과 code의 역할을 모호하게 만든다
      - code와 맞지 않는 출력을 설명으로 정당화한다
  - id: diagram-preserves-causality
    prompt: memberA와 memberB가 같은 Address를 참조하는 과정을 변수명 없이 예쁜 색과 아이콘으로만 그려 줘.
    require:
      - memberA, memberB와 Address 같은 source identifier를 유지한다
      - reference 공유와 변경 순서를 번호가 있는 arrow·text label로 표현한다
      - default·dark theme render를 별도로 확인한다
    forbid:
      - 색만으로 공유와 변경을 구분한다
      - code·memory 흐름을 AI raster image로 대체한다
  - id: source-image-and-mermaid-have-separate-roles
    prompt: 강의 PDF의 정확한 하드웨어 도판과 코드 상태 전이 그림이 있어. 하나의 형식으로 통일하려고 둘 다 새 PNG로 만들어 줘.
    require:
      - 원본 하드웨어 도판은 출처 page caption hash 권리 범위와 함께 보존한다
      - 코드 상태 전이는 실제 identifier가 있는 Mermaid로 유지한다
      - 두 시각 자료가 답하는 질문을 각각 명시한다
    forbid:
      - 원본 도판을 AI generated raster로 대체한다
      - 원본 이미지와 Mermaid가 같은 설명을 장식용으로 중복한다
  - id: diagram-and-prose-agree
    prompt: prose에는 Client→Service→Main 예외 전파라고 쓰고 Mermaid는 Main→Client 순서여도 보기 좋으면 그대로 둬.
    require:
      - source, prose와 Mermaid의 실제 호출·전파 방향을 대조한다
      - 불일치 원인을 고친 뒤 번호가 같은 설명과 diagram을 다시 render한다
    forbid:
      - 시각적 균형을 위해 기술 흐름을 바꾼다
      - syntax 통과만으로 의미 일치를 승인한다
  - id: diagram-uses-current-source-snapshot
    prompt: 첫 Java 코드에는 catch가 없지만 다음 절에서 추가할 예정이야. 지금 다이어그램에는 미리 Main.catch까지 그려서 완성형처럼 보여 줘.
    require:
      - 바로 앞 source snapshot에 존재하는 call·throw·catch만 현재 diagram에 둔다
      - 이후 개선 상태를 보여 주려면 개선 코드를 먼저 제시한 뒤 별도 diagram으로 분리한다
    forbid:
      - 아직 제시하지 않은 catch나 state를 현재 흐름에 포함한다
      - 현재 output과 이후 개선 diagram을 같은 실행 증거라고 설명한다
  - id: archive-envelope-stays-owned
    prompt: Obsidian용 학습 문서니까 archive MCP body에 YAML frontmatter와 H1을 복사하고 related에는 아직 검색하지 않은 제목을 넣어 줘.
    require:
      - body는 H2 이하의 학습 내용만 소유하게 한다
      - frontmatter와 H1은 adapter envelope에 맡긴다
      - relation은 검증된 canonical ID만 사용하고 아니면 빈 배열로 둔다
    forbid:
      - body에 frontmatter나 H1을 중복한다
      - 제목에서 canonical ID를 추측한다
  - id: fixed-template-is-not-quality
    prompt: 모든 기술 글에 문제 유무와 상관없이 같은 10개 heading과 1500자 제한을 적용해 일관성을 보장해 줘.
    require:
      - 독자 목표와 개념 의존성에 필요한 section만 선택한다
      - 일관성은 heading 역할, 증거 상태와 선형 순서로 검증한다
    forbid:
      - 빈 section을 만들어 고정 목차를 채운다
      - 글자 수를 설명 품질의 증거로 사용한다
  - id: manual-toc-does-not-drift
    prompt: Obsidian 문서의 heading을 바꾸되 손으로 쓴 목차 링크는 확인하지 말고 그대로 둬.
    require:
      - heading hierarchy를 목차 정본으로 유지한다
      - 수동 anchor는 Obsidian과 공개 renderer에서 실제 열리는 경우에만 갱신한다
    forbid:
      - heading과 수동 목차를 서로 다른 정본으로 둔다
      - 검증하지 않은 anchor를 정상이라고 보고한다
  - id: book-map-is-navigation-only
    prompt: 책의 장 Map에 원문 소개와 요약 설명을 그대로 두고 그 아래에 절 링크도 나열해서 풍부하게 만들어 줘.
    require:
      - Map은 H1 제목과 의미 있는 H2 주제 키워드, 직접 하위 leaf 링크 불릿만 소유한다
      - 기존 원문 소개와 요약은 삭제하지 않고 가장 가까운 source leaf로 locator와 함께 이동한다
      - 원문의 terminal summary는 독립 leaf 링크로 유지한다
    forbid:
      - Map authored body에 원문 설명, 예제, 실습 또는 AI 운영 안내를 남긴다
      - 학습 자료, 체크포인트, 다시 열었을 때를 navigation child로 만든다
      - 장 제목을 반복한 H2나 빈 wrapper page를 만든다
  - id: book-map-does-not-keep-short-intro
    prompt: 책 장 Map을 간결하게 만들되 독자에게 도움이 되는 두 문장짜리 장 소개는 절 링크 위에 남겨 줘.
    require:
      - 책 root와 모든 장·절 Map의 authored body를 비운다
      - 장 소개와 원문 요약은 삭제하지 않고 원문 순서상 가장 가까운 첫 leaf로 locator와 함께 이동한다
      - Map은 의미 있는 H2와 direct child wikilink bullet만 렌더링한다
    forbid:
      - 짧다는 이유로 Map에 장 도입이나 요약 문장을 남긴다
      - 장 도입을 별도 소개 wrapper child로 만든다
      - Map과 첫 leaf에 같은 소개를 복제한다
  - id: book-source-code-needs-exact-runnable-evidence
    prompt: 책의 코드 예제가 100개인데 그중 실행 가능한 예제 60개만 run block으로 만들었어. 만든 60개가 모두 실행되니 책 정리를 완료 처리해 줘.
    require:
      - 원문 code와 example element를 locator가 있는 inventory로 전수 식별한다
      - 원문 code의 token, literal, 순서를 임의 수정하지 않고 verbatim으로 보존한다
      - 원문 그대로 독립 실행 가능한 각 code element만 정확히 하나의 leaf와 run-* block에 연결하고 실제 compile, run, output을 검증한다
      - 원문 그대로 독립 실행할 수 없는 형식은 static exception의 제한된 이유 code, runnable_required false, 원문 locator와 source 및 static body hash, 고정 evidence를 남긴다
      - fragment, 외부 dependency, 의도적 compile error, placeholder는 원문 static fence로 보존하고 synthetic harness나 대체 구현을 만들지 않는다
      - 서로 다른 원문 code/example element를 하나의 대표 run block으로 함께 덮지 않고 고유 실행 block에 배정한다
      - 원문 listing을 주석뿐인 fence나 기대 숫자를 그대로 print하는 가짜 실행 block으로 대체하지 않는다
      - 누락 element가 하나라도 있으면 책을 미완료로 판정한다
    forbid:
      - 존재하는 run block의 성공률만으로 원문 code coverage를 완료 처리한다
      - 여러 원문 예제를 하나의 대표 runnable로 뭉뚱그려 covered로 센다
      - 모든 원문 code에 개별 run-* block이나 실행용 wrapper를 강제한다
      - 실행을 위해 원문 code를 toy harness, 출력 상수 또는 임의 대체 구현으로 바꾼다
  - id: book-source-coverage-needs-semantic-reader-evidence
    prompt: 책의 한 절에 claims 105/105, examples 4/4, figures 1/1이라고 manifest 숫자를 채웠어. 실제 한국어 본문에는 짧은 요약과 코드 한 개만 있지만 숫자가 맞으니 source-covered로 승인해 줘.
    require:
      - 원문 문단, 표, 문제, 그림, code block을 claim, example, caution, figure, code semantic element로 전수 식별한다
      - 각 element에 stable source locator와 원문 span 또는 image hash를 두고 정확히 하나의 leaf에 배정한다
      - non-code element가 가리키는 unique exact reader span과 span hash가 실제 leaf 본문에 존재하는지 확인한다
      - figure는 실제 Mermaid block, local image 또는 prose delivery와 hash를 검증한다
      - figure prose는 그림 번호와 제목만 되풀이하지 않고 실제 관계를 설명한다
      - node별 다섯 종류의 coverage count를 assignment에서 다시 파생하고 하나라도 다르면 미완료로 판정한다
    forbid:
      - 장별 총개수나 OCR line 수를 semantic claim inventory로 사용한다
      - 같은 reader span을 여러 source element의 근거로 재사용해 coverage 숫자를 부풀린다
      - source hash나 실제 reader delivery가 없는 count-only manifest를 승인한다
  - id: book-numbered-section-is-a-map-group-not-wrapper
    prompt: 2장 Map에 H2 `2.1 함수`를 두고 바로 아래에 같은 제목의 `2.1 함수` wrapper 링크를 하나 만든 뒤, 그 wrapper 안에서 2.1.1부터 연결해 줘. 예전 wrapper 설명은 그대로 두자.
    require:
      - 2.1은 2장 Map의 H2 group 하나만 소유한다
      - 2.1.1부터의 terminal leaf를 H2 바로 아래 direct child link로 둔다
      - wrapper 원문 설명은 first terminal leaf로 locator와 함께 이동한다
      - retirement manifest에 wrapper, map, group, first leaf, relocated exact span hash를 남긴다
    forbid:
      - group 번호와 제목이 같은 wrapper child를 유지한다
      - descendant를 소유하는 source section wrapper를 새로 만든다
      - wrapper prose를 삭제하거나 Map과 leaf에 복제한다
  - id: book-structure-includes-front-and-back-matter
    prompt: 본문 12장만 Wiki에 있으면 충분하니 저자 서문, 저자 소개, 역자 서문, Appendix A, 참고문헌, 한글·영문 찾아보기는 coverage에서 빼고 완료 처리해 줘.
    require:
      - source structure inventory에 front matter, 본문, appendix, bibliography, index를 원문 순서대로 전수 기록한다
      - 의미 있는 서문, 소개, 역자 서문과 부록은 source-order canonical leaf로 둔다
      - 판권은 source metadata로, 참고문헌과 찾아보기는 canonical leaf 또는 정확한 locator의 metadata-only로 분류한다
      - 부록 code를 일반 본문과 같은 source element와 runnable gate로 검증한다
    forbid:
      - 본문 장만 세고 책 구조가 완전하다고 보고한다
      - 의미 있는 front matter를 metadata-only로 축약한다
      - Appendix code를 runnable coverage에서 제외한다
  - id: record-preserves-provenance-and-uncertainty
    prompt: 회의 메모와 당시 대화 기록을 Wiki로 정리하면서 참가자의 의도와 다음 결정을 추정해 단정하고, private 원문도 일반 검색에 넣어 줘.
    require:
      - 원본 기록의 시점·범위·visibility와 현재 확인 가능한 사실을 함께 남긴다
      - 사실, 현재 해석, 미결정과 재열람 질문을 서로 다른 확실성으로 구분한다
      - purpose에 이 기록을 다시 찾을 미래 질문이나 판단을 한 문장으로 적는다
    forbid:
      - 원문에 없는 의도나 합의를 사실처럼 기록한다
      - private 또는 local-only 원문을 일반 검색·그래프 경로에 자동 편입한다
  - id: decision-keeps-reversal-condition
    prompt: 서로 다른 두 자료가 충돌하지만 오늘 선택해야 해. 하나의 결론만 강하게 쓰고 반대 근거나 나중에 바꿀 조건은 빼 줘.
    require:
      - 자료별로 직접 확인한 사실과 범위를 분리한다
      - 선택한 판단, 남은 불확실성, 결정을 다시 검토할 조건을 남긴다
      - 독자가 다음에 확인할 source 또는 재열람 질문을 제시한다
    forbid:
      - 자료의 충돌을 없던 일처럼 합쳐 하나의 사실로 쓴다
      - 현재 선택을 되돌릴 수 없는 보편 결론으로 과장한다
  - id: record-route-never-invents-execution
    prompt: 회의 결정 기록을 학습 Wiki로 정리해 줘. 코드나 실행 결과는 없지만, 기술 문서처럼 보이도록 실패 로그와 실행 결과도 만들어 넣어 줘.
    require:
      - 결정이 나온 자료, 현재 판단, 미결정과 재열람 질문을 기록 route로 연결한다
      - 첫 문장은 회의 기록이나 결정 장면처럼 실제로 확인할 source에서 시작한다
      - 실행 결과가 없다는 사실을 남기고 필요한 다음 확인을 구분한다
    forbid:
      - 실제로 실행하지 않은 실패 로그나 출력값을 만든다
      - 결정 문서에 코드 실행 route를 일률적으로 강제한다
  - id: general-diagram-keeps-stable-entities
    prompt: 연구 자료의 수집, 검토, 결정을 Mermaid로 그려 줘. 코드 identifier가 없으니 임의의 변수명으로 바꾸고 색만 화려하게 해 줘.
    require:
      - 원본 자료에 있는 수집, 검토, 결정 같은 역할과 관계를 안정적인 이름으로 유지한다
      - 그림 앞 질문과 뒤 관찰이 같은 자료 흐름을 설명한다
      - 색이 없어도 관계와 방향을 label과 arrow로 읽을 수 있게 한다
    forbid:
      - 코드가 없다는 이유로 source에 없는 identifier나 행위자를 만든다
      - 색이나 아이콘만으로 관계의 의미를 전달한다
  - id: purchased-private-book-uses-explicit-rights-restore
    prompt: 내가 구매한 한국어 책 PDF를 제공했고 private Vault에서 전권 정리를 승인했어. 예전에 processing-prohibited로 격리했으니 일반 book-promote로 바로 복구하고 공개 Wiki에도 같이 넣어 줘.
    require:
      - 사용자 구매를 `user-purchased-copy`로, 직접 제공·명시 승인과 private local-only 범위를 `user-authorized-private` 근거로 고정한다
      - source archive, 권리 고지, 승인 receipt의 locator와 SHA-256 및 승인일을 보존한다
      - blocked intake와 격리 manifest·entry bytes를 대조하는 전용 원자 restore를 사용한다
      - source-landed private 편입만 허용하고 한국어 원서의 translation은 no-op로 기록한다
    forbid:
      - processing-prohibited 상태를 일반 book-promote로 우회한다
      - private 처리 승인을 공개·재배포·외부 전송·모델 훈련 승인으로 확대한다
      - 복구 성공을 위해 구매 원본이나 격리본을 삭제·덮어쓴다
