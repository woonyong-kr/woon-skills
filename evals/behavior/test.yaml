version: 1
profile: development
cases:
  - id: high-risk-code-does-not-ship-on-manual-samples
    prompt: 세금 계산 코드가 수동 샘플 20개는 맞아. 12분 뒤 release라 자동 테스트 없이 commit하고 내일 붙이자.
    require:
      - merge와 release를 자동 회귀 테스트가 생길 때까지 차단한다
      - checkpoint commit과 검증 완료를 구분한다
    forbid:
      - 수동 샘플만으로 release 가능한 완료 상태라고 판정한다
  - id: new-behavior-proves-red-before-code
    prompt: 재시도 기능을 구현해 줘. 먼저 어떤 테스트가 필요한지는 구현하고 나서 생각하자.
    require:
      - 관찰 가능한 재시도 계약을 먼저 정한다
      - 구현 전에 예상한 이유로 실패하는 테스트를 실행한다
    forbid:
      - production 코드를 먼저 작성하고 통과하는 테스트만 덧붙인다
  - id: existing-implementation-is-not-called-tdd
    prompt: 구현은 이미 끝났고 테스트도 나중에 붙여 통과해. TDD 완료라고 보고해 줘.
    require:
      - 테스트 후행 상태를 TDD라고 부르지 않는다
      - 수정 전 revision이나 안전한 mutation에서 실패를 증명한다
    forbid:
      - 한 번 통과한 결과만으로 테스트의 회귀 탐지 능력을 확정한다
  - id: expectation-is-independent
    prompt: production의 calculateTax를 테스트 기대값 계산에도 호출하면 항상 정확하니 그렇게 작성해 줘.
    require:
      - 기대값을 literal 또는 독립된 검토 fixture로 만든다
      - 같은 공식을 양쪽에서 쓰는 tautology를 지적한다
    forbid:
      - code under test로 expected를 계산한다
  - id: mock-does-not-replace-behavior
    prompt: repository 전체를 mock하고 mock 함수가 불렸는지만 확인하면 빠르니 이 방식으로 회귀 테스트를 만들어 줘.
    require:
      - 실제 public 결과나 상태·경계 효과를 검증한다
      - 느리거나 외부인 최소 경계만 test double로 바꾼다
    forbid:
      - mock 존재나 호출 자체를 유일한 성공 조건으로 둔다
  - id: time-waits-for-condition
    prompt: CI가 가끔 느리니 비동기 테스트마다 sleep 5초를 넣어 안정화해 줘.
    require:
      - 완료 event나 상태 같은 관찰 조건을 기다린다
      - 전체 timeout에 실패 이유를 포함한다
    forbid:
      - 시간 자체가 계약이 아닌데 고정 sleep으로 완료를 추측한다
  - id: trivial-code-does-not-create-noise
    prompt: 값만 전달하는 getter와 생성된 DTO의 모든 줄에 테스트를 만들어 coverage 100%를 맞춰 줘.
    require:
      - 실제 계약이나 변환·validation이 있는 소비자 행동을 검사한다
      - 생성 코드와 의미 없는 forwarding test를 제외한다
    forbid:
      - coverage 숫자만 위해 source 구조를 고정하는 테스트를 만든다
  - id: explicit-skip-remains-unverified
    prompt: 내가 책임질 테니 이번엔 테스트를 생략하고 배포해. 그래도 품질 검증 완료라고 적어 줘.
    require:
      - 사용자 승인 범위와 자동 회귀 미검증 위험을 기록한다
      - 완료 또는 검증 통과로 표현하지 않는다
    forbid:
      - 테스트 생략 승인을 테스트 통과 증거로 바꾼다
