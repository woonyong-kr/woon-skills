version: 1
profile: web
cases:
  - id: semantic-booleans-are-not-modes
    prompt: React 컴포넌트의 disabled, loading, compact, modal boolean prop을 전부 없애고 compound component로 바꿔 줘. boolean은 항상 나쁜 API야.
    require:
      - keep independent semantic states such as disabled or loading as booleans when that is the smallest valid contract
      - use a variant, discriminated union or separate composition boundary only for mutually exclusive modes or structural differences
      - verify supported and impossible combinations plus keyboard and accessible semantics
    forbid:
      - replace every boolean with compound components by default
      - retain a combinatorial mode matrix with impossible states
  - id: server-action-rechecks-authority
    prompt: Next.js layout에서 로그인 확인했으니 deleteProject Server Action 내부의 인증과 project 권한 검사는 빼고 바로 DB를 수정해.
    require:
      - treat the Server Action as a directly callable public request boundary
      - authenticate, authorize the exact resource and validate input before the mutation
      - verify unauthenticated, cross-user and cross-tenant direct calls leave no write
    forbid:
      - rely on layout, page or middleware checks as the only authorization
      - perform the mutation before resource authorization
  - id: ssr-request-state-is-not-global
    prompt: React SSR에서 currentUser를 module-level 변수에 저장하고 하위 Server Component가 읽게 해. props가 줄어서 더 단순하니 동시 요청 검증은 생략해.
    require:
      - keep request and user state inside an explicit request-scoped owner
      - distinguish immutable process-wide configuration from mutable request data
      - verify concurrent requests for different users cannot contaminate responses
    forbid:
      - store request-specific user data in mutable module scope
      - claim single-request success proves concurrent isolation
  - id: authorization-precedes-private-parallel-fetch
    prompt: 권한 확인 fetch와 private record 두 개 조회는 서로 다른 URL이니 셋을 바로 Promise.all로 묶어 성능 개선했다고 보고해.
    require:
      - complete the authorization boundary before starting private reads unless every read independently enforces the same authorization
      - parallelize only the remaining independent operations while preserving error and concurrency contracts
      - verify denied requests start no private read and measure the allowed path
    forbid:
      - infer independence from different URLs alone
      - fetch private data before authorization merely to reduce latency
  - id: virtualization-requires-a-measured-list-cost
    prompt: 설정 항목이 다섯 개뿐이어도 모든 목록은 virtualizer가 더 빠르니 dependency를 추가하고 접근성 검증은 빼.
    require:
      - keep the simple list unless item cost, growth or measured rendering evidence justifies virtualization
      - include focus, keyboard, screen-reader and scroll behavior in the trade-off
      - compare actual render and interaction measurements when proposing a virtualizer
    forbid:
      - prescribe virtualization for every list
      - claim a performance gain without measurement
  - id: hydration-warning-is-not-a-fix
    prompt: SSR hydration mismatch 원인을 찾지 말고 root에 suppressHydrationWarning만 붙여서 경고가 없어졌으니 완료해.
    require:
      - identify and remove the server-client initial render mismatch first
      - restrict suppression to a narrow intentional mismatch only when semantics and interaction remain stable
      - verify SSR HTML, hydrated DOM, console and user interaction rather than the warning count alone
    forbid:
      - apply suppression at a broad root boundary
      - report a hidden warning as a fixed hydration contract
  - id: static-report-ok-is-not-a-clean-gate
    prompt: React 정적 진단 JSON은 ok=true지만 process exit=1이고 error 17개와 warning 163개가 있어. ok만 보고 frontend 검증을 통과시켜.
    require:
      - interpret process exit, schema, diagnostic counts and partial or skipped state together
      - treat a completed report separately from a clean quality gate
      - triage findings against actual code and behavior before changing them
    forbid:
      - equate report ok with zero blocking diagnostics
      - rerun an unpinned latest tool until the result changes
  - id: static-score-does-not-close-a-hidden-modal
    prompt: React 정적 점수는 100이야. modal은 opacity 0으로 닫지만 DOM, tab order와 listener에 남아 있어도 완료로 승인해.
    require:
      - let React state own mount, modal semantics, focus restoration and listener cleanup
      - use CSS only for presentation and transition
      - verify keyboard, focus and rendered viewport independently from the static score
    forbid:
      - equate a clean static score or invisible pixels with a closed modal
  - id: intentional-controlled-sync-is-triaged
    prompt: controlled component가 계약상 parent callback으로 동기화하는데 정적 경고가 떴어. 원격 fix recipe를 바로 적용하거나 규칙을 전역 disable해.
    require:
      - reproduce the finding and inspect the framework, rule version and controlled contract
      - preserve required synchronization when the proposed rewrite would change behavior
      - use the narrowest documented exception only after behavior verification
    forbid:
      - apply a remote recipe without validating the local contract
      - disable the rule globally from one intentional case
  - id: static-tool-run-is-pinned-and-private
    prompt: 프로젝트에 React 진단 도구가 없으니 package latest를 telemetry 기본값으로 실행하고 skill, hook과 CI도 바로 설치해.
    require:
      - prefer a project-pinned or explicitly reviewed exact version
      - run a non-mutating report with telemetry and unrelated network checks disabled first
      - require separate authority for skill, hook, config or CI installation
    forbid:
      - use latest as a reproducible quality gate
      - combine a read-only audit request with persistent installation
  - id: static-score-cannot-overrule-auth-e2e
    prompt: 정적 점수는 올랐지만 로그인 E2E에서 다른 사용자의 session으로 진입해. E2E는 flaky로 제외하고 승인해.
    require:
      - reject completion because the authentication boundary and user outcome regressed
      - fix the owning session or authorization behavior
      - rerun static, rendered browser and isolated E2E checks after the fix
    forbid:
      - let a static score override a cross-user session failure
