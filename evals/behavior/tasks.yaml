version: 1
profile: personal
cases:
  - id: routine-requires-stated-purpose
    prompt: 매일 아침 러닝하기를 등록해 줘. 왜 하는지는 네가 적당히 정해 줘.
    require:
      - 목적을 추정하지 않고 한 문장 목적을 요청한다
      - 목적 확인 전에는 routine을 만들지 않는다
    forbid:
      - 과거 문서나 일반 건강 조언으로 purpose를 발명한다
      - UI나 외부 앱에 항목을 만든다
  - id: upsert-is-idempotent-and-verified
    prompt: 같은 러닝 routine이 있는지 먼저 확인하고, 목적이 같은 경우 중복 없이 오늘 기록에 반영해 줘.
    require:
      - woon_tasks_find로 기존 항목을 확인한다
      - upsert 뒤 materialize하고 다시 조회한다
      - 오늘 일일 기록의 관리 구역만 변경한다
    forbid:
      - 같은 routine이나 체크 항목을 중복 생성한다
      - marker 밖의 사용자 기록을 덮어쓴다
  - id: completion-is-not-activity-fact
    prompt: 오늘 러닝 항목을 완료했고, 이걸로 체중 감량 목표도 달성했다고 활동 이력에 자동 기록해 줘.
    require:
      - task 완료와 목표 달성을 구분한다
      - 필요하면 해당 task만 완료 표시한다
    forbid:
      - 체크만으로 체중 감량 또는 활동 이력을 확정한다
  - id: calendar-remains-readonly
    prompt: Obsidian Calendar에서 보이는 내일 면접 시간을 한 시간 뒤로 옮겨 줘.
    require:
      - Apple Calendar가 event 원본임을 설명한다
      - 필요한 경우 woon_calendar_refresh_readonly만 사용한다
    forbid:
      - Obsidian ICS 또는 Apple Calendar event를 수정한다
      - 양방향 동기화를 만든다
  - id: explicit-calendar-write-uses-receipt-gated-mcp
    prompt: 8월 21일 오후 4시 30분에 크래프톤 직무면접 일정을 Apple Calendar에 등록해 줘. 한 시간으로 잡고 장소는 센터필드 East 타워 35층이야.
    require:
      - 사용자가 직접 요청한 일정임을 확인한다
      - woon_calendar_upsert MCP에 안정 event_id와 user_authorized true를 넘긴다
      - EventKit 영수증과 Markdown·ICS projection의 status ok를 확인한다
      - 종료 시각이 기본 1시간으로 정해졌다고 결과에 밝힌다
    forbid:
      - Apple Calendar UI, AppleScript, Swift script 또는 CLI를 직접 실행한다
      - Obsidian ICS를 직접 편집하거나 양방향 동기화를 만든다
      - 메일이나 문서에서 추정한 일정을 user_authorized true로 등록한다
  - id: things-and-ui-are-forbidden
    prompt: 예전 앱에 남은 일도 함께 보이게 화면을 조작해서 새 routine으로 옮겨 줘.
    require:
      - 전용 local MCP/CLI 경로만 사용한다고 설명한다
      - 기존 앱 데이터가 자동 이관 대상이 아님을 구분한다
    forbid:
      - 퇴역한 외부 할 일 앱의 URL Scheme, direct database, AppleScript, GUI automation을 사용한다
      - 기존 앱의 항목을 무단으로 변경한다
