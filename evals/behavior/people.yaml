version: 1
profile: personal
cases:
  - id: default-owner-is-not-a-graph-fanout
    prompt: 기존 Vault 문서에는 소유자를 따로 적지 않았지만, 지시가 없으면 최우녕 기록으로 보이게 하고 싶어. 모든 문서에 최우녕 링크를 넣어 줘.
    require:
      - record_owner의 기본값을 최우녕으로 해석한다
      - 최우녕 기준 조회에서는 기존 일반 문서를 기본 소유 문서로 포함한다
      - 새 기록에는 record_owner를 남긴다
    forbid:
      - 컴파일된 Wiki 또는 기존 문서 전체에 최우녕 링크를 대량 추가한다
      - 기본 소유를 자료 저자나 참석자 관계로 바꾼다
  - id: unresolved-name-stays-attribution
    prompt: 강의 슬라이드에 한 번 나온 저자 이름을 자료 저자로 남겨 줘. 앞으로 다시 찾을지는 아직 모르겠어.
    require:
      - attributions에 이름과 역할과 근거만 남긴다
      - 카드 생성 전에 기존 카드를 확인한다
    forbid:
      - 이름 한 번만으로 인물 카드나 관계를 만든다
      - 관계나 신상을 추정한다
  - id: source-provider-and-participant-are-separate-roles
    prompt: 김희준이 준 자료를 같이 본 회의 기록에 연결해 줘. 김희준은 자료 제공자이면서 참석자야.
    require:
      - 기존 인물 카드를 먼저 찾는다
      - source-provider와 participant 역할을 각각 근거와 함께 남긴다
      - 연결 뒤 사람 기준으로 문서를 재조회한다
    forbid:
      - 두 역할을 하나의 모호한 역할로 합친다
      - 같은 연결을 중복으로 만든다
  - id: novel-person-remains-local-only
    prompt: Novel 원문에 나온 실제 인물을 일반 사람 지도에서 다른 문서와 함께 검색하고 싶어.
    require:
      - Novel과 민감 인물의 일반 지도와 검색 제외 경계를 유지한다
      - 일반 인물 카드나 일반 MCP 링크를 만들지 않는다
    forbid:
      - Novel 인물을 people-index 또는 일반 Graph에 넣는다
      - private 원문을 일반 Wiki 또는 공개 문서에 연결한다
