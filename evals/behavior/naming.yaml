version: 1
cases:
  - id: naming-has-explicit-semantics
    profile: development
    prompt: data, process, UserManager처럼 모호한 이름을 일관되게 고쳐 줘.
    require:
      - 역할, 행동, 대상, 단위와 단수·복수를 기준으로 새 이름을 정한다
      - 사용자 어휘의 선호와 금지 항목을 적용한다
      - 공개 API 호출자와 호환성 영향을 확인한다
      - 함수명은 행동과 도메인 대상을 중심으로 짧게 유지한다
      - Request와 Command는 실제 전송·애플리케이션 경계를 확인한 뒤 선택한다
    forbid:
      - 읽기 좋은 이름처럼 검증할 수 없는 기준만 제시한다
      - Manager를 다른 포괄 이름으로 단순 치환한다
      - sort and filter reports by minimum score처럼 구현 단계와 매개변수를 이름에 반복한다
      - 경계 증거 없이 Request 또는 Command를 추측한다
  - id: naming-lookup-contract
    profile: development
    prompt: 사용자가 없어도 정상인 조회와 반드시 있어야 하는 조회, 원격 API 조회 함수 이름을 정리해 줘.
    require:
      - 선택 조회, 필수 조회와 원격 조회의 부재·오류·부수 효과 계약을 구분한다
      - find, require, fetch 중 실제 계약에 맞는 표현을 선택한다
      - 원격 source보다 호출자가 받는 domain 결과를 함수 대상으로 사용한다
    forbid:
      - 모든 조회를 get으로 통일한다
      - 원격 호출을 순수한 local 접근처럼 숨긴다
  - id: naming-state-transition
    profile: development
    prompt: 문서의 soft delete, hard delete, 공개와 복구 동작 이름을 일관되게 정해 줘.
    require:
      - archive, delete, publish, restore의 상태 전이와 복구 가능성을 구분한다
      - 쌍을 이루는 이름의 추상화 수준을 맞춘다
    forbid:
      - 보관과 영구 삭제를 모두 delete로 부른다
      - 실제 가시성 변화가 없는 저장을 publish로 부른다
  - id: naming-role-needs-evidence
    profile: development
    prompt: UserService, SessionManager, PaymentAdapter, ReportHelper 이름이 실제 책임에 맞는지 정리해 줘.
    require:
      - Service, Manager와 Adapter를 실제 유스케이스, 생명주기와 경계로 증명한다
      - 한 유스케이스 Service는 직접적인 행동과 대상을 사용한다
      - Helper는 소유 기능과 관찰 가능한 행동으로 바꾼다
    forbid:
      - 모든 타입에 역할 접미사를 유지한다
      - 포괄 접미사를 서로 치환하고 책임은 그대로 둔다
      - 직접적인 동사 대신 Creation이나 Processing 명사화로 이름을 늘린다
  - id: naming-boolean-unit-cardinality
    profile: development
    prompt: enabled, errors, timeout, created 같은 변수들이 Boolean인지 목록인지 시간인지 모호해. 이름을 정리해 줘.
    require:
      - Boolean의 true 의미를 긍정문으로 고정한다
      - 컬렉션은 복수, 시점과 기간은 구분하고 필요한 단위를 포함한다
    forbid:
      - 이중 부정 Boolean을 만든다
      - timestamp와 duration을 같은 접미사로 표현한다
  - id: naming-public-compatibility
    profile: development
    prompt: 외부 패키지가 import하는 processData를 fetchStocks로 바꾸고 싶어. 안전하게 이름을 정리해 줘.
    require:
      - source, test, export, 문자열 기반 사용처와 외부 소비자를 확인한다
      - 기존 이름, 새 이름, 의미 차이와 호환 방법을 기록한다
      - 같은 계약이면 alias, 다른 계약이면 변환 경계가 있는 wrapper나 adapter를 검토한다
    forbid:
      - 외부 소비자 확인 없이 공개 이름을 즉시 삭제한다
      - 제거 조건 없는 영구 wrapper를 만든다
