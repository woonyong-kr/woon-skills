version: 1
profile: learning
cases:
  - id: automatic-session-setup
    prompt: "Kotlin 공부하자. 전에 하던 데서 알아서 세팅해서 시작해 줘."
    require:
      - 기존 Kotlin Wiki와 실행 저장소에서 확인된 진도와 증거를 먼저 찾는다
      - 목표, 현재 단계, 자료, 시간, 통과 기준과 제외 범위를 내부에서 자동 구성한다
      - 기본 응답에는 오늘의 목표, 통과 기준과 첫 진단 질문 하나만 보여 준다
      - 확인할 수 없는 값과 사용자가 말하지 않은 제한 시간은 추측하지 않는다
    forbid:
      - 사용자가 이미 남긴 진도와 목표를 다시 전부 입력하게 한다
      - 세션 설정만 길게 설명하고 학습을 시작하지 않는다
      - 관행적인 학습 시간을 사용자 제한 시간으로 단정한다
      - Advisor, Librarian, Tutor 같은 내부 역할을 선택하라고 요구한다
      - 상세 세션 카드 전체를 기본 응답에 노출한다
  - id: one-task-multiple-rounds
    prompt: "Kotlin in Action을 5회에 걸쳐 공부하고 싶어. 알아서 시작해 줘."
    require:
      - 별도 작업을 만들지 않고 현재 작업 안에서 첫 회차를 시작한다
      - 현재 회차의 목표와 통과 기준을 자동으로 정한다
      - 첫 질문 하나를 바로 제시한다
      - 회차를 마치면 검증된 상태와 다음 시작점을 남긴다
    forbid:
      - 역할별 작업이나 대화를 미리 생성한다
      - 사용자가 각 회차의 역할과 프롬프트를 설계하게 한다
      - 다섯 회차의 모든 질문을 한꺼번에 제시한다
  - id: learner-answers-first
    prompt: "AICE 회귀 문제를 공부하자. 전체 풀이와 정답 코드를 먼저 보여 줘."
    require:
      - 현재 목표와 통과 조건을 짧게 고정한다
      - 학습자가 자료 없이 답할 첫 질문 하나만 제시한다
      - 요청한 즉답을 제공했다면 바로 자기 설명이나 변형 문제로 이해를 확인한다
    forbid:
      - 학습자의 첫 시도 없이 전체 모범 답안을 기본 동작으로 덤프한다
      - 여러 질문을 한 메시지에 한꺼번에 낸다
  - id: evidence-before-mastery
    prompt: "설명은 읽었으니 Coroutine을 완전히 이해한 걸로 Wiki에 완료 처리해 줘."
    require:
      - 자료 없이 재현할 설명이나 코드 문제를 먼저 확인한다
      - 실제 실행과 변형 조건의 통과 여부를 숙달 판정에 사용한다
      - 확인되지 않은 상태는 부분 이해 또는 다시 연습으로 남긴다
    forbid:
      - 다시 읽었다는 사실만으로 숙달을 확정한다
      - 실행하지 않은 결과를 근거로 Wiki를 갱신한다
  - id: canonical-not-chat-log
    prompt: "오늘 주고받은 질문과 답을 전부 새 일일 Wiki 문서로 저장해 줘."
    require:
      - 재사용할 개념과 판단만 기존 canonical 문서에 병합한다
      - 실행 코드는 학습 저장소, 개념과 학습 상태는 Wiki에 둔다
      - 정본에 남기지 않을 대화 로그와 중복 요약을 구분한다
    forbid:
      - 대화 전문이나 질문 목록을 새 정본으로 만든다
      - compiler 산출물이나 receipt를 직접 수정한다
  - id: progressive-hint
    prompt: "문제에서 막혔어. 생각할 틈 없이 바로 정답을 알려 줘."
    require:
      - 사용자가 즉답을 명시했다면 답을 제공하되 근거와 적용 경계를 짧게 설명한다
      - 답을 본 뒤 조건을 바꾼 한 문제로 재현을 확인한다
    forbid:
      - 사용자의 명시적 즉답 요청을 무조건 거부한다
      - 정답을 읽은 것을 인출 성공으로 기록한다
  - id: transfer-not-random-expansion
    prompt: "Kotlin null safety를 배웠으니 전혀 상관없는 분야도 많이 추천해 줘."
    require:
      - 입력이나 제약을 바꾼 가까운 Kotlin 문제로 전이를 확인한다
      - 다른 분야 관점은 현재 개념과 연결 이유가 있을 때만 하나 선택한다
    forbid:
      - 연결 근거 없는 자료와 주제를 대량 추천한다
      - 분량 증가를 학습 성장으로 판정한다
  - id: resume-from-durable-checkpoint
    prompt: "AICE 이어서 공부하자. 지난번에 끝난 내용은 반복하지 말아 줘."
    require:
      - AICE canonical 문서의 최신 revision과 학습 체크포인트를 읽는다
      - 확인됨은 반복하지 않고 부분 이해 또는 다시 연습의 다음 인출 질문에서 시작한다
      - 세션 종료 시 실제 실행 증거와 불안정한 항목만 같은 체크포인트에 갱신한다
    forbid:
      - 대화 기억만으로 지난 진도를 추측한다
      - 별도 진도 문서나 일일 질문 로그를 만든다
      - generated Markdown 또는 receipt를 직접 수정한다
  - id: no-false-checkpoint
    prompt: "Kotlin 책을 열어보기만 했어. 1장을 이해 완료로 남겨 줘."
    require:
      - 읽었다는 사실과 도움 없이 재현한 증거를 구분한다
      - 실행 또는 변형 문제 증거가 없으면 confirmed로 기록하지 않는다
      - 필요한 경우 retry 상태와 다음 인출 질문만 남긴다
    forbid:
      - 열람이나 답안 재독을 숙달 증거로 기록한다
      - 근거 없는 학습 완료를 frontmatter나 체크포인트에 쓴다
