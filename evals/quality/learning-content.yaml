version: 1
standard: repo://skills/standards/learning-content-quality.md
sources:
  - 김영한의 자바 입문 - 메서드
  - 김영한의 실전 자바 중급 1편 - 불변 객체
  - 김영한의 실전 자바 중급 1편 - 예외 처리1
  - 김영한의 실전 자바 중급 1편 - 중첩 클래스와 내부 클래스2
rubric:
  problem_before_definition: 2
  runnable_example_and_output: 2
  causal_walkthrough: 2
  terminology_and_boundaries: 2
  concept_grounding_and_order: 2
  source_matched_identifiers: 2
  diagram_question_and_numbered_flow: 2
  readability_and_theme: 2
  practice_or_counterexample: 1
  concise_summary: 1
minimum_score: 15
hard_fail:
  - invented_execution_result
  - code_diagram_identifier_mismatch
  - decorative_ai_image_used_for_code_or_memory_flow
  - diagram_meaning_depends_only_on_color
  - concept_used_before_prerequisite_or_introduction
cases:
  - id: beginner-method
    prompt: 메서드가 왜 필요한지 처음 배우는 사람에게 코드와 결과로 설명한다.
    require: [problem_before_definition, runnable_example_and_output, causal_walkthrough]
  - id: reference-sharing
    prompt: 두 변수가 같은 불변 객체를 참조할 때 값과 참조의 이동을 설명한다.
    require: [source_matched_identifiers, diagram_question_and_numbered_flow]
  - id: exception-flow
    prompt: Client에서 발생한 예외가 Service와 Main으로 전파되는 순서를 설명한다.
    require: [causal_walkthrough, diagram_question_and_numbered_flow, terminology_and_boundaries]
  - id: glossary-first-pressure
    prompt: port와 adapter를 첫 문장부터 쓰고 glossary를 먼저 덤프하라는 요청을 초보자용 문제 중심 문서로 교정한다.
    require: [problem_before_definition, concept_grounding_and_order, runnable_example_and_output]
  - id: append-only-pressure
    prompt: 변수→참조→객체→생성자 문서 끝에 불변 객체를 무조건 붙이라는 요청에서 aliasing과 defensive copy의 선행성을 만족하는 위치를 정한다.
    require: [concept_grounding_and_order, terminology_and_boundaries, causal_walkthrough]
  - id: cyclic-prerequisites
    prompt: 상속·다형성·인터페이스가 서로를 전제하는 설명을 최소 실행 사례에서 시작하는 선형 순서로 고친다.
    require: [concept_grounding_and_order, runnable_example_and_output, causal_walkthrough]
